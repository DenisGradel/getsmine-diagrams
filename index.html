<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GetsMine Diagrams</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #111314;
        --panel: #181c20;
        --line: #303942;
        --text: #f4f6f7;
        --muted: #aab3bb;
        --blue: #7db7ff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      header {
        padding: 28px 32px 18px;
        border-bottom: 1px solid var(--line);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 28px;
        font-weight: 740;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        max-width: 920px;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.55;
      }

      main {
        padding: 24px 32px 34px;
      }

      .toolbar {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
        margin-bottom: 18px;
      }

      a {
        color: var(--blue);
      }

      .button {
        display: inline-flex;
        min-height: 42px;
        align-items: center;
        justify-content: center;
        border: 1px solid #486986;
        border-radius: 8px;
        padding: 0 14px;
        background: #1c2b38;
        color: #f7fbff;
        text-decoration: none;
        font-weight: 650;
      }

      .frame {
        width: 100%;
        height: min(78vh, 980px);
        min-height: 620px;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #0f1112;
      }

      iframe {
        width: 100%;
        height: 100%;
        border: 0;
      }

      @media (max-width: 760px) {
        header,
        main {
          padding-left: 18px;
          padding-right: 18px;
        }

        h1 {
          font-size: 24px;
        }

        .frame {
          min-height: 560px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>GetsMine Diagrams</h1>
      <p>Рабочие HTML-схемы по агентам, видео и операционным процессам. Первая схема показывает, как связаны Света, Claude Chat, GM Video Production Agent, HeyGen, Runway, агент платного трафика и источники контекста.</p>
    </header>
    <main>
      <div class="toolbar">
        <a class="button" href="./diagrams/gm-video-agent-network.html">Открыть схему отдельно</a>
        <span>GM Video Production Agent Network</span>
      </div>
      <div class="frame">
        <iframe title="GM Video Production Agent Network" src="./diagrams/gm-video-agent-network.html"></iframe>
      </div>
    </main>
  </body>
</html>
